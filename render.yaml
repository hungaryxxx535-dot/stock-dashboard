services:
  - type: web
    name: fei-stock-akshare-api
    runtime: docker
    dockerfilePath: ./akshare-service/Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CACHE_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AKSHARE_SERVICE_TOKEN
        generateValue: true

  - type: web
    name: fei-stock-dashboard
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: AKSHARE_API_URL
        value: https://fei-stock-akshare-api.onrender.com
